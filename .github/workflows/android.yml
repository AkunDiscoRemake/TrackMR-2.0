name: Android • TrackMR 2.0
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Test + Android arm64 APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Pinned Cardboard source + MediaPipe model
        run: ./scripts/bootstrap.sh
      - name: GLES shader compiler
        run: sudo apt-get update -qq && sudo apt-get install -y glslang-tools
      - name: Compile and link ESSL shaders
        run: python3 scripts/check_shaders.py
      - name: OpenXR frame protocol tests
        run: g++ -std=c++17 -Wall -Wextra -Werror tests/openxr_protocol_test.cpp -o /tmp/openxr_protocol && /tmp/openxr_protocol
      - name: Curved window hit / texture coordinate tests
        run: g++ -std=c++17 -Wall -Wextra -Werror tests/curved_window_test.cpp -o /tmp/curve_test && /tmp/curve_test
      - name: Native geometry tests
        run: g++ -std=c++17 -Wall -Wextra -Werror tests/native_math_test.cpp -o /tmp/native_math_test && /tmp/native_math_test
      - name: Unit tests, APKs and lint
        run: ./scripts/ci-build.sh
      - name: Verify bundled Hand Landmarker (offline runtime asset)
        run: python3 scripts/verify_model.py app/src/main/assets/hand_landmarker.task app/build/outputs/apk/debug/app-debug.apk
      - name: APK integrity and provenance
        run: |
          mkdir -p artifacts
          cp .cache/hand-model-provenance.json artifacts/HAND_MODEL.json
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TrackMR-2.0-alpha05-arm64.apk
          cp runtime/build/outputs/apk/debug/runtime-debug.apk artifacts/TrackMR-Runtime-Companion-alpha05-arm64.apk
          cp dev-api/build/libs/dev-api.jar artifacts/TrackMR-Dev-API-v1.jar
          sha256sum artifacts/*.apk artifacts/*.jar > artifacts/SHA256SUMS.txt
          git rev-parse HEAD > artifacts/SOURCE_REVISION.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/TrackMR-2.0-alpha05-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/TrackMR-Runtime-Companion-alpha05-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TrackMR-2.0-debug-arm64
          path: artifacts/
          retention-days: 14
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            core/build/reports/
            xr/build/reports/
            handtracking/build/reports/
            app/build/reports/
            runtime/build/reports/
            .cache/gradle-build.log
          if-no-files-found: ignore
  native-hands:
    name: Android native hand inference (YUV + rotations)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: ./scripts/bootstrap.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real JNI inference on Android, not mocks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/ci-native-hands.sh
      - name: Native inference results
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files=list(pathlib.Path('tracking-validation/build/outputs/androidTest-results').rglob('TEST-*.xml'))
          if not files: print('::error title=Native hand test::No instrumentation results'); raise SystemExit(1)
          for p in files:
              r=ET.parse(p).getroot()
              message=str(r.attrib)+' '+''.join(r.itertext())[-9000:]
              print('::notice title=Native hand test::'+message.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-hand-inference-reports
          path: |
            tracking-validation/build/reports/
            tracking-validation/build/outputs/androidTest-results/
            .cache/native-hand-test.log
            .cache/native-hand-logcat.txt
